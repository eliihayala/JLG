<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2130">
<title>JLG Control · ERP Zona Franca</title>
<style>
:root{--ink:#173245;--navy:#0b2130;--sky:#58c2e7;--blue:#2f9ed3;--bg:#f4f8fa;--line:#dce7ed;--muted:#6d8190;--ok:#247f68;--warn:#a96d0b;--bad:#b94747;--purple:#6659ad;--shadow:0 8px 24px rgba(18,53,73,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}body{overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted);font-size:14px}.small{font-size:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700}.primary{background:linear-gradient(135deg,#1677a9,#34a6da);color:#fff}.ghost{background:#fff;border:1px solid #cfe0e8;color:var(--ink)}.soft{background:#e9f7fc;color:#176d9b}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#e7f5ef;color:var(--ok)}.warn{background:#fff3dd;color:var(--warn)}.bad{background:#fbe9e9;color:var(--bad)}.info{background:#e8f6fc;color:#176d9b}.purple{background:#eeebfb;color:var(--purple)}
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#fff}.visual{background:linear-gradient(145deg,#61c9ec,#2996ce);display:grid;place-items:center;padding:48px}.visual img{width:min(520px,84%);filter:drop-shadow(0 22px 32px rgba(16,66,93,.2))}.login-side{display:grid;place-items:center;padding:32px}.login-box{width:min(430px,100%)}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#197aa9;font-weight:800}.login h1{font-size:34px;line-height:1.12;margin:10px 0}.field{margin-top:14px}.field label,.select-box label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #cedde5;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.role{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left}.role.active{border-color:#8fd1ec;background:#eefaff}.role small{display:block;color:var(--muted);margin-top:3px}
.topbar{min-height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;object-fit:cover;border-radius:11px}.brand b,.brand small{display:block}.brand small{opacity:.7}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top-actions select{width:250px;padding:9px 10px}.pill{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 10px;font-size:13px}.menu-btn{display:none}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{background:#0d2939;color:#d9e9f1;padding:15px 12px}.nav{display:grid;gap:4px}.nav-title,.group{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#88a7b8;padding:5px 10px 8px}.group{color:#6f91a3;padding-top:14px;padding-bottom:3px}.nav button{border:0;background:transparent;color:#c8dbe5;text-align:left;border-radius:9px;padding:10px 11px;font-size:14px}.nav button:hover{background:rgba(255,255,255,.06)}.nav button.active{background:rgba(87,195,231,.18);color:#fff;font-weight:750;border-left:3px solid var(--sky)}.main{padding:22px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px}.page-head h1{margin:0;font-size:25px}.page-head p{margin:4px 0 0}.head-actions{display:flex;align-items:end;gap:9px;flex-wrap:wrap}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.kpi,.card,.module{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.kpi{padding:16px}.kpi-label{font-size:12px;color:var(--muted)}.value{font-size:27px;font-weight:800;margin:6px 0 2px}.card{padding:16px}.card h2{font-size:18px;margin:0 0 8px}.card h3{font-size:15px;margin:0 0 7px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.module{padding:15px}.module .icon{width:38px;height:38px;border-radius:11px;background:#eaf7fc;color:#176d9b;display:grid;place-items:center;font-size:18px;margin-bottom:10px}.module p{margin:5px 0 0;color:var(--muted);font-size:12px}.hero{background:linear-gradient(115deg,#0c2b3c,#176d9b);color:#fff;border-radius:15px;padding:17px;display:flex;justify-content:space-between;align-items:center;gap:12px}.hero .muted{color:rgba(255,255,255,.72)}.table-wrap{overflow:auto;margin-top:13px;border:1px solid #e5edf2;border-radius:12px;max-height:560px}table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}th,td{padding:10px 11px;border-bottom:1px solid #e6eef2;text-align:left;white-space:nowrap}th{background:#f5fafc;color:#526a78;font-size:12px;position:sticky;top:0;z-index:1}tbody tr:hover{background:#f8fbfd}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.filters{display:grid;grid-template-columns:2fr 1fr auto;gap:9px;margin:14px 0}.list{display:grid;gap:10px;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:10px;border-bottom:1px solid #eaf0f4}.row:last-child{border-bottom:0}.notice{padding:13px;border-radius:11px;background:#fff4df;border:1px solid #efd79e;color:#79540e}.success{padding:13px;border-radius:11px;background:#e7f5ef;border:1px solid #bde0d3;color:#17634c}.error{padding:13px;border-radius:11px;background:#fbe9e9;border:1px solid #e6bcbc;color:#8a3434}.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.empty{padding:30px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:1/-1}.alert-row{display:grid;grid-template-columns:100px 1.1fr 2fr 120px 110px 110px;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #eaf0f4}.alert-row.header{font-size:12px;font-weight:800;color:var(--muted);background:#f7fafc}.upload-box{border:2px dashed #b9d6e5;border-radius:14px;padding:20px;text-align:center;background:#f8fcfe}.file-list{display:grid;gap:7px;margin-top:10px}.file-item{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}.summary-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:14px}.summary-strip .mini{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.mini span{display:block;color:var(--muted);font-size:11px}.mini b{font-size:18px}.scrim{display:none}
@media(max-width:1150px){.alert-row{grid-template-columns:90px 1fr 1.6fr 100px 100px}.alert-row>*:nth-child(6){display:none}.summary-strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1050px){.menu-btn{display:inline-flex}.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:68px;bottom:0;width:min(310px,86vw);z-index:40;transform:translateX(-105%);transition:transform .2s ease;overflow:auto}.sidebar.open{transform:translateX(0)}.scrim{display:block;position:fixed;inset:68px 0 0 0;background:rgba(0,0,0,.28);z-index:35}.scrim.hidden{display:none!important}.kpis,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.main{padding:18px}}
@media(max-width:680px){.login{grid-template-columns:1fr}.visual{display:none}.roles,.kpis,.grid3,.filters,.form-grid,.summary-strip{grid-template-columns:1fr}.topbar{align-items:flex-start}.brand small,.pill{display:none}.top-actions select{width:150px}.page-head,.hero{flex-direction:column;align-items:flex-start}.head-actions{width:100%}.main{padding:13px}.pagination{align-items:flex-start;flex-direction:column}.alert-row{grid-template-columns:1fr;gap:5px}.alert-row.header{display:none}.alert-row>*{white-space:normal}.alert-row>*:nth-child(6){display:block}.form-grid .wide{grid-column:auto}}
</style>
</head>
<body>
<section id="login" class="login">
  <div class="visual"><img src="jlg-logo.png" alt="Logo JLG"></div>
  <div class="login-side"><div class="login-box">
    <div class="eyebrow">ERP especializado en Zona Franca</div>
    <h1>Una plataforma para toda la operación.</h1>
    <p class="muted">Alertas, clientes, RET, ZFI5, tránsitos, stock, egresos y administración.</p>
    <div class="field"><label>Usuario</label><input value="karen@jlg.com.ar"></div>
    <div class="field"><label>Contraseña</label><input id="password" type="password" value="demo123"></div>
    <div class="roles"><button id="internalRole" class="role active"><b>Gestión interna</b><small>Todos los módulos</small></button><button id="clientRole" class="role"><b>Portal del cliente</b><small>Información de una empresa</small></button></div>
    <div id="loginClientBox" class="field hidden"><label>Seleccionar cliente</label><select id="loginClient">
      <option value="EGT">EGT ARGENTINA S.A.</option><option value="Yamaha">YAMAHA MOTOR ARGENTINA S.A.</option><option value="ZMG">ZMG ARGENTINA S.R.L.</option><option value="Ferrum">FERRUM S.A.</option><option value="Cetrogar">CETROGAR S.A.</option><option value="Mondial">MONDIAL</option><option value="MRT">METALÚRGICA RÍO TERCERO S.A.</option><option value="OTR">OTR MAX</option><option value="Syensqo">SYENSQO ARGENTINA S.A.</option><option value="Prevent">PREVENT GAS</option><option value="Lilus">LILUS</option><option value="Pampa">PAMPA</option><option value="Logexpor">LOGEXPOR</option><option value="Bracol">BRACOL</option>
    </select></div>
    <button id="loginButton" class="btn primary" style="width:100%;margin-top:18px">Ingresar</button>
    <div class="muted small" style="margin-top:9px">Contraseña de demostración: demo123</div>
  </div></div>
</section>
<section id="app" class="hidden">
<header class="topbar">
  <div class="brand"><button id="menuButton" class="btn ghost menu-btn" aria-label="Abrir menú">☰</button><img src="jlg-logo.png" alt="JLG"><div><b>JLG Control</b><small id="environment">Gestión interna</small></div></div>
  <div class="top-actions"><select id="globalClient" aria-label="Cliente activo">
    <option value="EGT">EGT ARGENTINA S.A.</option><option value="Yamaha">YAMAHA MOTOR ARGENTINA S.A.</option><option value="ZMG">ZMG ARGENTINA S.R.L.</option><option value="Ferrum">FERRUM S.A.</option><option value="Cetrogar">CETROGAR S.A.</option><option value="Mondial">MONDIAL</option><option value="MRT">METALÚRGICA RÍO TERCERO S.A.</option><option value="OTR">OTR MAX</option><option value="Syensqo">SYENSQO ARGENTINA S.A.</option><option value="Prevent">PREVENT GAS</option><option value="Lilus">LILUS</option><option value="Pampa">PAMPA</option><option value="Logexpor">LOGEXPOR</option><option value="Bracol">BRACOL</option>
  </select><span id="userPill" class="pill">Karen · Administradora</span><button id="changeRole" class="btn ghost">Perfil</button><button id="logout" class="btn ghost">Salir</button></div>
</header>
<div class="shell">
<aside id="sidebar" class="sidebar"><div class="nav">
  <div class="nav-title">JLG Control</div><div class="group">Operaciones</div>
  <button class="active" data-module="inicio">⌂ Inicio y alertas</button><button data-module="clientes">◉ Clientes y contratos</button><button data-module="ingresos">⇩ Ingresos RET</button><button data-module="stock">▦ Stock y trazabilidad</button><button data-module="egresos">⇧ Egresos y reexpediciones</button><button data-module="operaciones">⇄ Operaciones / ZFI5</button>
  <div class="group internal-only">Administración</div><button class="internal-only" data-module="facturacion">$ Facturación</button><button class="internal-only" data-module="cuentas">≋ Cuentas corrientes</button><button class="internal-only" data-module="proveedores">▣ Proveedores y OP</button><button class="internal-only" data-module="tesoreria">◆ Tesorería</button>
  <div class="group">Gestión</div><button data-module="notificaciones">🔔 Notificaciones</button><button class="internal-only" data-module="rezago">⚑ Mercadería en rezago</button><button class="internal-only" data-module="contabilidad">∑ Contabilidad</button><button class="internal-only" data-module="tarifas">% Tarifas</button><button class="internal-only" data-module="reportes">▥ Reportes</button><button class="internal-only" data-module="seguridad">⚙ Usuarios y auditoría</button>
</div></aside>
<div id="scrim" class="scrim hidden"></div><main class="main"><div id="view"></div></main>
</div>
</section>
<script>window.EGT=[];</script>
<script src="egt1.js"></script><script src="egt2.js"></script><script src="egt3.js"></script><script src="egt4.js"></script><script src="egt5.js"></script><script src="egt6.js"></script>
