<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JLG Control · ERP Zona Franca</title>
<style>
:root{--navy:#0b2130;--blue:#2f9ed3;--bg:#f4f8fa;--line:#dce7ed;--text:#173245;--muted:#6d8190;--ok:#247f68;--warn:#a96d0b;--bad:#b94747}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#58c2e7,#176d9b)}.loginbox{width:min(440px,100%);background:#fff;border-radius:18px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.18)}.loginbox h1{margin:0 0 8px}.field{margin-top:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.selectbox select{width:100%;padding:11px;border:1px solid #cfdde5;border-radius:10px;background:#fff}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.role{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left}.role.active{background:#eefaff;border-color:#7bc8e8}.role small{display:block;color:var(--muted);margin-top:4px}.topbar{background:var(--navy);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;border-radius:10px}.shell{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 66px)}.sidebar{background:#0d2939;padding:14px}.nav{display:grid;gap:4px}.nav h3{color:#88a7b8;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:12px 8px 4px}.nav button{border:0;background:transparent;color:#d7e6ed;text-align:left;padding:10px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(88,194,231,.18);color:#fff}.main{padding:22px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:16px}.pagehead h1{margin:0}.muted{color:var(--muted);font-size:14px}.selectbox{min-width:290px}.selectbox label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.value{font-size:26px;font-weight:800;margin-top:5px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#e7f5ef;color:var(--ok)}.warn{background:#fff3dd;color:var(--warn)}.bad{background:#fbe9e9;color:var(--bad)}.info{background:#e8f6fc;color:#176d9b}.tablewrap{overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}th,td{padding:10px;border-bottom:1px solid #e7eef2;text-align:left;white-space:nowrap}th{background:#f4fafc}.menu{display:none}@media(max-width:900px){.menu{display:inline-block}.shell{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:block}.kpis,.grid3{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.kpis,.grid3,.grid2,.roles{grid-template-columns:1fr}.pagehead{flex-direction:column;align-items:stretch}.selectbox{min-width:0}.topbar{align-items:flex-start;gap:8px}.main{padding:13px}}
</style>
</head>
<body>
<section id="login" class="login">
<div class="loginbox">
<h1>JLG Control</h1><div class="muted">Demo integral para Zona Franca</div>
<div class="field"><label>Usuario</label><input value="karen@jlg.com.ar"></div>
<div class="field"><label>Contraseña</label><input id="password" type="password" value="demo123"></div>
<div class="roles"><button id="internalRole" class="role active"><b>Gestión interna</b><small>Todos los módulos</small></button><button id="clientRole" class="role"><b>Portal del cliente</b><small>Vista por empresa</small></button></div>
<div id="loginClientBox" class="field hidden"><label>Seleccionar cliente</label><select id="loginClient">
<option value="EGT">EGT ARGENTINA S.A.</option><option value="Yamaha">YAMAHA MOTOR ARGENTINA S.A.</option><option value="ZMG">ZMG ARGENTINA S.R.L.</option><option value="Ferrum">FERRUM S.A.</option><option value="Cetrogar">CETROGAR S.A.</option><option value="Mondial">MONDIAL</option><option value="MRT">METALÚRGICA RÍO TERCERO S.A.</option><option value="OTR">OTR MAX</option><option value="Syensqo">SYENSQO ARGENTINA S.A.</option><option value="Prevent">PREVENT GAS</option><option value="Lilus">LILUS</option><option value="Pampa">PAMPA</option><option value="Logexpor">LOGEXPOR</option><option value="Bracol">BRACOL</option>
</select></div>
<button id="loginButton" class="btn primary" style="width:100%;margin-top:18px">Ingresar</button>
<div class="muted" style="margin-top:8px;font-size:12px">Contraseña: demo123</div>
</div></section>
<section id="app" class="hidden">
<header class="topbar"><div class="brand"><button id="menu" class="btn ghost menu">☰</button><img src="jlg-logo.png" alt="JLG"><div><b>JLG Control</b><div id="environment" style="font-size:12px;opacity:.75">Gestión interna</div></div></div><div><button id="logout" class="btn ghost">Salir</button></div></header>
<div class="shell"><aside id="sidebar" class="sidebar"><div class="nav">
<h3>Operaciones</h3><button class="active" data-page="inicio">⌂ Inicio</button><button data-page="clientes">◉ Clientes y contratos</button><button data-page="ingresos">⇩ Ingresos RET</button><button data-page="stock">▦ Stock e inventario</button><button data-page="egresos">⇧ Egresos</button><button data-page="operaciones">⇄ Operaciones / ZFI5</button>
<h3 class="internal">Administración</h3><button class="internal" data-page="facturacion">$ Facturación</button><button class="internal" data-page="cuentas">≋ Cuentas corrientes</button><button class="internal" data-page="proveedores">▣ Proveedores y OP</button><button class="internal" data-page="tesoreria">◆ Tesorería</button>
<h3>Gestión</h3><button data-page="notificaciones">🔔 Notificaciones</button><button class="internal" data-page="rezago">⚑ Rezago</button><button class="internal" data-page="contabilidad">∑ Contabilidad</button><button class="internal" data-page="tarifas">% Tarifas</button><button class="internal" data-page="reportes">▥ Reportes</button><button class="internal" data-page="auditoria">⚙ Usuarios y auditoría</button>
</div></aside><main class="main"><div id="view"></div></main></div>
</section>
<script>window.EGT=[];</script><script src="egt1.js"></script><script src="egt2.js"></script><script src="egt3.js"></script><script src="egt4.js"></script><script src="egt5.js"></script><script src="egt6.js"></script>
<script>
const clients={EGT:'EGT ARGENTINA S.A.',Yamaha:'YAMAHA MOTOR ARGENTINA S.A.',ZMG:'ZMG ARGENTINA S.R.L.',Ferrum:'FERRUM S.A.',Cetrogar:'CETROGAR S.A.',Mondial:'MONDIAL',MRT:'METALÚRGICA RÍO TERCERO S.A.',OTR:'OTR MAX',Syensqo:'SYENSQO ARGENTINA S.A.',Prevent:'PREVENT GAS',Lilus:'LILUS',Pampa:'PAMPA',Logexpor:'LOGEXPOR',Bracol:'BRACOL'};
const yamaha=[['25001TRM4006242R','2025','FZ X','YAMAHA',50,50,50,50,68.023,68.023],['26001TRM4007001A','2026','PRIME','YAMAHA',78,78,78,78,72.4,72.4]];
let role='internal',selected='EGT',page='inicio';const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('es-AR',{maximumFractionDigits:3}).format(Number(n)||0);const rows=()=>selected==='EGT'?window.EGT:selected==='Yamaha'?yamaha:[];const has=r=>(+r[5]>0||+r[7]>0||+r[9]>0);
function selector(){return '<div class="selectbox"><label>CLIENTE SELECCIONADO</label><select id="clientSelect">'+Object.entries(clients).map(([k,v])=>'<option value="'+k+'" '+(k===selected?'selected':'')+'>'+v+'</option>').join('')+'</select></div>'}
function head(t,s){return '<div class="pagehead"><div><h1>'+t+'</h1><div class="muted">'+s+'</div></div>'+selector()+'</div>'}
function render(){const data=rows(),active=data.filter(has),units=active.reduce((a,r)=>a+(+r[7]||0),0),m3=active.reduce((a,r)=>a+(+r[9]||0),0),name=clients[selected];let html='';
if(page==='inicio')html=head('Panel operativo','Estado general del cliente y sus módulos.')+'<div class="kpis"><div class="kpi"><div class="muted">Cliente</div><div class="value" style="font-size:18px">'+name+'</div></div><div class="kpi"><div class="muted">Registros</div><div class="value">'+fmt(data.length)+'</div></div><div class="kpi"><div class="muted">Unidades disponibles</div><div class="value">'+fmt(units)+'</div></div><div class="kpi"><div class="muted">m³ disponibles</div><div class="value">'+fmt(m3)+'</div></div></div><div class="grid3"><div class="card"><b>Ingresos RET</b><p class="muted">C.RET, I.RET y generación de stock.</p></div><div class="card"><b>Egresos</b><p class="muted">ZFE1, ZFTR y retiros parciales.</p></div><div class="card"><b>Facturación</b><p class="muted">Almacenaje, seguro y movimientos.</p></div><div class="card"><b>Contabilidad</b><p class="muted">Asientos, IVA, caja y bancos.</p></div><div class="card"><b>Notificaciones</b><p class="muted">Alertas operativas y administrativas.</p></div><div class="card"><b>Reportes</b><p class="muted">Inventario, facturación y auditoría.</p></div></div>';
else if(page==='stock')html=head('Stock e inventario','Consulta del stock del cliente seleccionado.')+'<div class="kpis"><div class="kpi"><div class="muted">Registros</div><div class="value">'+fmt(data.length)+'</div></div><div class="kpi"><div class="muted">Con saldo</div><div class="value">'+fmt(active.length)+'</div></div><div class="kpi"><div class="muted">Unidades</div><div class="value">'+fmt(units)+'</div></div><div class="kpi"><div class="muted">m³</div><div class="value">'+fmt(m3)+'</div></div></div><div class="card" style="margin-top:14px"><div class="tablewrap"><table><tr><th>Tránsito</th><th>Fecha</th><th>Artículo</th><th>Marca/modelo</th><th>Saldo bultos</th><th>Saldo unidades</th><th>Saldo m³</th></tr>'+(data.length?data.slice(0,50).map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+fmt(r[5])+'</td><td>'+fmt(r[7])+'</td><td>'+fmt(r[9])+'</td></tr>').join(''):'<tr><td colspan="7">Sin stock cargado.</td></tr>')+'</table></div></div>';
else{const titles={clientes:'Clientes y contratos',ingresos:'Ingresos RET',egresos:'Egresos y reexpediciones',operaciones:'Operaciones / ZFI5',facturacion:'Facturación',cuentas:'Cuentas corrientes',proveedores:'Proveedores y órdenes de pago',tesoreria:'Tesorería',notificaciones:'Notificaciones',rezago:'Mercadería en rezago',contabilidad:'Contabilidad',tarifas:'Tarifas',reportes:'Reportes',auditoria:'Usuarios y auditoría'};html=head(titles[page]||'Módulo','Información del cliente seleccionado.')+'<div class="grid2"><div class="card"><h2>'+name+'</h2><p class="muted">Este módulo forma parte del demo integral y se encuentra vinculado al selector central de clientes.</p><span class="badge '+(data.length?'ok':'warn')+'">'+(data.length?'Información disponible':'Pendiente de carga')+'</span></div><div class="card"><h2>Estado del módulo</h2><div class="tablewrap"><table><tr><th>Concepto</th><th>Estado</th></tr><tr><td>Cliente seleccionado</td><td>'+name+'</td></tr><tr><td>Registros vinculados</td><td>'+fmt(data.length)+'</td></tr><tr><td>Funcionalidad</td><td><span class="badge info">Demo operativo</span></td></tr></table></div></div></div>'}
$('view').innerHTML=html;const cs=$('clientSelect');if(cs)cs.onchange=e=>{selected=e.target.value;render()};document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
$('internalRole').onclick=()=>{role='internal';$('internalRole').classList.add('active');$('clientRole').classList.remove('active');$('loginClientBox').classList.add('hidden')};$('clientRole').onclick=()=>{role='client';$('clientRole').classList.add('active');$('internalRole').classList.remove('active');$('loginClientBox').classList.remove('hidden')};
$('loginButton').onclick=()=>{if($('password').value!=='demo123'){alert('Contraseña incorrecta');return}if(role==='client')selected=$('loginClient').value;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('environment').textContent=role==='client'?'Portal privado · '+clients[selected]:'Gestión interna';document.querySelectorAll('.internal').forEach(x=>x.classList.toggle('hidden',role==='client'));page='inicio';render()};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();$('sidebar').classList.remove('open')});$('menu').onclick=()=>$('sidebar').classList.toggle('open');$('logout').onclick=()=>{$('app').classList.add('hidden');$('login').classList.remove('hidden')};
</script>
</body></html>
