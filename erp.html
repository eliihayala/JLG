<style>
:root{--navy:#092738;--navy2:#0d3448;--blue:#1699d2;--sky:#59c7eb;--bg:#f3f7f9;--card:#fff;--ink:#173345;--muted:#6e8290;--line:#dce7ec;--ok:#1d8066;--warn:#a66d13;--bad:#b74343;--shadow:0 12px 30px rgba(13,53,73,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750}.primary{background:linear-gradient(135deg,#1187bd,#35b1e2);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.soft{background:#eaf8fd;color:#126c97}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#e6f5ef;color:var(--ok)}.warn{background:#fff3dc;color:var(--warn)}.info{background:#e8f6fc;color:#126c97}
.login{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr;background:#fff}.login-art{display:grid;place-items:center;padding:50px;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.34),transparent 35%),linear-gradient(145deg,#65caeb,#218fc8)}.login-art img{width:min(520px,82%);filter:drop-shadow(0 28px 38px rgba(10,50,72,.22))}.login-side{display:grid;place-items:center;padding:34px}.login-box{width:min(430px,100%)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:850;color:#147eae}.login h1{font-size:36px;line-height:1.08;margin:10px 0}.field{margin-top:14px}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:800;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #cadbe4;border-radius:11px;background:#fff;padding:11px 12px;color:var(--ink)}textarea{min-height:90px;resize:vertical}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.role{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px;text-align:left}.role.active{border-color:#86d2ef;background:#edfaff}.role small{display:block;color:var(--muted);margin-top:4px}
.topbar{height:70px;position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 18px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#fff}.brand b,.brand small{display:block}.brand small{opacity:.72}.top-actions{display:flex;align-items:center;gap:9px}.pill{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 11px;font-size:13px}.menu-btn{display:none}.shell{display:grid;grid-template-columns:274px minmax(0,1fr);min-height:calc(100vh - 70px)}.sidebar{background:linear-gradient(180deg,var(--navy2),#092333);color:#d7e6ee;padding:16px 12px}.nav-title,.group{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#89a7b7;padding:5px 10px 8px}.group{padding-top:15px;padding-bottom:4px;color:#6e91a4}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#c9dce5;text-align:left;padding:10px 11px;border-radius:9px;font-size:14px}.nav button:hover{background:rgba(255,255,255,.06)}.nav button.active{background:rgba(84,199,236,.17);color:#fff;font-weight:800;border-left:3px solid var(--sky)}.main{padding:22px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:17px}.page-head h1{margin:0;font-size:27px}.page-head p{margin:5px 0 0}.card,.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card{padding:17px}.card h2{margin:0 0 7px;font-size:18px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.kpi{padding:16px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;font-size:28px;margin-top:5px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.hero{background:linear-gradient(115deg,#0a2b3d,#137aa7);border-radius:16px;color:#fff;padding:19px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hero .muted{color:rgba(255,255,255,.74)}.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;align-items:end;margin-top:14px}.filters.three{grid-template-columns:1.3fr 1fr auto}.selector-card{display:grid;grid-template-columns:minmax(250px,420px) 1fr;gap:18px;align-items:end;margin-bottom:14px}.selector-card .field{margin:0}.client-summary{padding:11px 13px;border-radius:12px;background:#eef8fc;border:1px solid #cde7f1}.table-wrap{overflow:auto;border:1px solid #e3edf1;border-radius:12px;margin-top:13px;max-height:560px}table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}th,td{padding:10px 11px;border-bottom:1px solid #e7eef2;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f5fafc;color:#536d7b;font-size:12px}tbody tr:hover{background:#f8fbfd}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:14px}.upload-box{border:2px dashed #b6d8e6;border-radius:14px;padding:20px;text-align:center;background:#f8fcfe}.upload-box strong{display:block;margin-bottom:5px}.file-name{margin-top:9px;font-size:12px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:1/-1}.quote-layout{display:grid;grid-template-columns:1fr .85fr;gap:14px}.quote-total{font-size:34px;font-weight:850;margin:8px 0}.breakdown{display:grid;gap:9px;margin-top:12px}.break-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e8eef2;padding-bottom:8px}.notice{padding:13px;border-radius:11px;background:#fff4de;border:1px solid #efd69d;color:#77520d}.success{padding:13px;border-radius:11px;background:#e6f5ef;border:1px solid #b9dfd1;color:#166049}.empty{padding:30px;text-align:center;color:var(--muted)}.scrim{display:none}
@media(max-width:1050px){.menu-btn{display:inline-flex}.shell{grid-template-columns:1fr}.sidebar{position:fixed;top:70px;bottom:0;left:0;width:min(315px,86vw);z-index:40;transform:translateX(-105%);transition:.2s;overflow:auto}.sidebar.open{transform:translateX(0)}.scrim{display:block;position:fixed;inset:70px 0 0;background:rgba(0,0,0,.3);z-index:35}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.quote-layout{grid-template-columns:1fr}}
@media(max-width:700px){.login{grid-template-columns:1fr}.login-art{display:none}.main{padding:13px}.brand small,.pill{display:none}.topbar{align-items:flex-start;height:auto;min-height:70px}.page-head,.hero{align-items:flex-start;flex-direction:column}.kpis,.filters,.filters.three,.form-grid,.upload-grid,.selector-card{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.roles{grid-template-columns:1fr}.top-actions{gap:6px}.top-actions .btn{padding:9px 10px}}
</style>

<body>
<section id="login" class="login">
<div class="login-art"><img src="jlg-logo.png" alt="Logo JLG"></div>
<div class="login-side"><div class="login-box"><div class="eyebrow">Gestión integral de Zona Franca</div><h1>JLG Control</h1><p class="muted">Operaciones, trazabilidad, documentación, tarifas y presupuestos.</p><div class="field"><label>Usuario</label><input id="username" value="karen@jlg.com.ar"></div><div class="field"><label>Contraseña</label><input id="password" type="password" value="demo123"></div><div class="roles"><button id="roleInternal" class="role active"><b>Gestión interna</b><small>Administración completa</small></button><button id="roleClient" class="role"><b>Portal del cliente</b><small>Operaciones y presupuesto</small></button></div><div id="clientLoginField" class="field hidden"><label>Empresa</label><select id="clientLogin"></select></div><button id="loginBtn" class="btn primary" style="width:100%;margin-top:18px">Ingresar</button><div class="small muted" style="margin-top:9px">Demostración: contraseña <b>demo123</b></div></div></div>
</section>
<section id="app" class="hidden"><header class="topbar"><div class="brand"><button id="menuBtn" class="btn ghost menu-btn">☰</button><img src="jlg-logo.png" alt="JLG"><div><b>JLG Control</b><small id="environment">Gestión interna</small></div></div><div class="top-actions"><span id="userPill" class="pill">Karen · Administradora</span><button id="profileBtn" class="btn ghost">Perfil</button><button id="logoutBtn" class="btn ghost">Salir</button></div></header><div class="shell"><aside id="sidebar" class="sidebar"><div class="nav"><div class="nav-title">JLG Logistic Group</div><div class="group">Operaciones</div><button class="active" data-page="home">⌂ Inicio y alertas</button><button data-page="income">⇩ Ingresos RET</button><button data-page="stock">▦ Stock y trazabilidad</button><button data-page="outcome">⇧ Egresos y reexpediciones</button><button data-page="zfi5">⇄ ZFI5 y tránsitos</button><div class="group internal-only">Administración</div><button class="internal-only" data-page="clients">◉ Clientes y contratos</button><button class="internal-only" data-page="rates">$ Tarifas por cliente</button><button class="internal-only" data-page="billing">▤ Facturación</button><button class="internal-only" data-page="accounts">≋ Cuentas corrientes</button><div class="group">Herramientas</div><button data-page="quote">✦ Mi presupuesto</button><button data-page="docs">▣ Documentación</button></div></aside><div id="scrim" class="scrim hidden"></div><main id="main" class="main"></main></div></section>
<script>
'use strict';
const CLIENTS={EGT:{name:'EGT ARGENTINA S.A.',unit:'m3',currency:'USD',storage:0.72,minStorage:95,insurance:0.08,minInsurance:35,income:140,outcome:155,flat:0,notes:'Almacenaje por m³/día.'},Yamaha:{name:'YAMAHA MOTOR ARGENTINA S.A.',unit:'m3',currency:'USD',storage:0.68,minStorage:120,insurance:0.08,minInsurance:40,income:160,outcome:175,flat:0,notes:'Tarifa operativa por volumen.'},ZMG:{name:'ZMG ARGENTINA S.R.L.',unit:'flat',currency:'USD',storage:0,minStorage:0,insurance:0.08,minInsurance:35,income:150,outcome:165,flat:4800,notes:'Tarifa plana mensual por 4.000 m².'},Ferrum:{name:'FERRUM S.A.',unit:'m2',currency:'ARS',storage:588,minStorage:160000,insurance:0.08,minInsurance:45000,income:190000,outcome:205000,flat:0,notes:'Almacenaje por m²/día en pesos.'},Cetrogar:{name:'CETROGAR S.A.',unit:'m3',currency:'ARS',storage:588,minStorage:160000,insurance:0.08,minInsurance:45000,income:185000,outcome:200000,flat:0,notes:'Almacenaje por m³/día.'},Mondial:{name:'MONDIAL',unit:'m3',currency:'USD',storage:0.75,minStorage:100,insurance:0.08,minInsurance:35,income:145,outcome:160,flat:0,notes:'Tarifa en USD por m³/día.'},MRT:{name:'METALÚRGICA RÍO TERCERO S.A.',unit:'m2',currency:'USD',storage:0.82,minStorage:110,insurance:0.08,minInsurance:35,income:155,outcome:170,flat:0,notes:'Tarifa por m²/día.'},OTR:{name:'OTR MAX',unit:'m3',currency:'USD',storage:0.70,minStorage:95,insurance:0.08,minInsurance:35,income:145,outcome:160,flat:0,notes:'Tarifa por m³/día.'},Syensqo:{name:'SYENSQO ARGENTINA S.A.',unit:'m2',currency:'USD',storage:0.88,minStorage:125,insurance:0.08,minInsurance:40,income:165,outcome:180,flat:0,notes:'Tarifa por m²/día.'},Prevent:{name:'PREVENT GAS',unit:'m3',currency:'ARS',storage:620,minStorage:160000,insurance:0.08,minInsurance:45000,income:190000,outcome:210000,flat:0,notes:'Tarifa en pesos por m³/día.'},Lilus:{name:'LILUS',unit:'m3',currency:'USD',storage:0.67,minStorage:90,insurance:0.08,minInsurance:35,income:140,outcome:155,flat:0,notes:'Tarifa por m³/día.'},Pampa:{name:'PAMPA',unit:'m2',currency:'USD',storage:0.90,minStorage:0,insurance:0.08,minInsurance:35,income:150,outcome:165,flat:0,notes:'Almacenaje USD 0,90 por m²/día.'},Logexpor:{name:'LOGEXPOR',unit:'m3',currency:'USD',storage:0.76,minStorage:110,insurance:0.08,minInsurance:40,income:160,outcome:175,flat:0,notes:'Tarifa por m³/día.'},Bracol:{name:'BRACOL',unit:'m3',currency:'USD',storage:0.73,minStorage:100,insurance:0.08,minInsurance:35,income:150,outcome:165,flat:0,notes:'Tarifa por m³/día.'}};
const SAMPLE=[{client:'EGT',zfi5:'19033ZFI5003067S',transit:'19001TRM4002974F',item:'1',sub:'0',goods:'Partes y accesorios',qty:324,unit:'UN',status:'En stock'},{client:'Yamaha',zfi5:'26033ZFI5001290M',transit:'26001TRM4000842A',item:'1',sub:'0',goods:'Motocicletas y repuestos',qty:86,unit:'UN',status:'En stock'},{client:'ZMG',zfi5:'26033ZFI5001438P',transit:'26001TRM4000911C',item:'2',sub:'0',goods:'Mercadería general',qty:1140,unit:'BULTOS',status:'Parcial'},{client:'Pampa',zfi5:'26033ZFI5001511D',transit:'26001TRM4001027F',item:'1',sub:'1',goods:'Equipamiento industrial',qty:42,unit:'UN',status:'En stock'}];
let state={mode:'internal',client:'EGT',page:'home',files:{c:'',i:''}};const $=id=>document.getElementById(id);const money=(n,c)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:c,maximumFractionDigits:c==='ARS'?0:2}).format(Number(n)||0);function options(selected){return Object.entries(CLIENTS).map(([k,v])=>`<option value="${k}" ${k===selected?'selected':''}>${v.name}</option>`).join('')}function clientSelector(){const c=CLIENTS[state.client];return `<div class="card selector-card"><div class="field"><label>Cliente de la consulta</label><select id="pageClient">${options(state.client)}</select></div><div class="client-summary"><b>${c.name}</b><div class="small muted">${c.notes} · Moneda: ${c.currency}</div></div></div>`}function bindClientSelector(){const el=$('pageClient');if(el)el.addEventListener('change',e=>{state.client=e.target.value;render()})}function pageHead(title,desc){return `<div class="page-head"><div><h1>${title}</h1><p class="muted">${desc}</p></div></div>`}function render(){const f={home:homePage,income:incomePage,stock:stockPage,outcome:outcomePage,zfi5:zfi5Page,clients:clientsPage,rates:ratesPage,billing:billingPage,accounts:accountsPage,quote:quotePage,docs:docsPage};$('main').innerHTML=(f[state.page]||homePage)();bindCommon()}function bindCommon(){bindClientSelector();const q=$('calcQuote');if(q)q.addEventListener('click',calculateQuote);const cfile=$('fileC');if(cfile)cfile.addEventListener('change',e=>setFile('c',e));const ifile=$('fileI');if(ifile)ifile.addEventListener('change',e=>setFile('i',e));const saveRet=$('saveRet');if(saveRet)saveRet.addEventListener('click',validateRet)}
function homePage(){const c=CLIENTS[state.client];return `${pageHead('Inicio y alertas','Resumen operativo de JLG Logistic Group')}<div class="hero"><div><b>${state.mode==='client'?c.name:'Gestión operativa central'}</b><div class="muted">Documentación, stock y vencimientos en una única plataforma.</div></div><span class="badge info">Sistema activo</span></div><div class="kpis" style="margin-top:14px"><div class="kpi"><span>Ingresos pendientes</span><b>6</b></div><div class="kpi"><span>RET incompletos</span><b>2</b></div><div class="kpi"><span>Egresos programados</span><b>9</b></div><div class="kpi"><span>Alertas documentales</span><b>3</b></div></div><div class="grid2"><div class="card"><h2>Alertas prioritarias</h2><div class="breakdown"><div class="break-row"><span>Falta archivo I.RET</span><span class="badge warn">Pendiente</span></div><div class="break-row"><span>ZFI5 próximo a revisión</span><span class="badge info">48 horas</span></div><div class="break-row"><span>Presupuesto solicitado por cliente</span><span class="badge ok">Nuevo</span></div></div></div><div class="card"><h2>Accesos rápidos</h2><div class="toolbar"><button class="btn soft" onclick="go('income')">Cargar RET</button><button class="btn soft" onclick="go('stock')">Consultar stock</button><button class="btn soft" onclick="go('quote')">Presupuestar</button></div></div></div>`}
function incomePage(){return `${pageHead('Ingresos RET','Carga y control documental de ingresos')}${state.mode==='internal'?clientSelector():''}<div class="card"><h2>Nuevo ingreso</h2><div class="notice">Cada ingreso requiere los dos archivos: <b>C.RET</b> e <b>I.RET</b>. El sistema no permitirá continuar si falta alguno.</div><div class="upload-grid"><label class="upload-box"><strong>Archivo C.RET</strong><span class="muted small">Seleccionar archivo C</span><input id="fileC" type="file" accept=".ret,.txt" hidden><div id="nameC" class="file-name">${state.files.c||'Sin archivo seleccionado'}</div></label><label class="upload-box"><strong>Archivo I.RET</strong><span class="muted small">Seleccionar archivo I</span><input id="fileI" type="file" accept=".ret,.txt" hidden><div id="nameI" class="file-name">${state.files.i||'Sin archivo seleccionado'}</div></label></div><div class="form-grid" style="margin-top:14px"><div class="field"><label>Número de tránsito</label><input placeholder="Ej.: 26001TRM4000000A"></div><div class="field"><label>Fecha estimada de arribo</label><input type="date"></div><div class="field wide"><label>Observaciones</label><textarea placeholder="Datos adicionales de la operación"></textarea></div></div><div class="toolbar"><button id="saveRet" class="btn primary">Validar y registrar ingreso</button></div><div id="retResult" style="margin-top:12px"></div></div>`}function setFile(type,e){const f=e.target.files&&e.target.files[0];state.files[type]=f?f.name:'';$(type==='c'?'nameC':'nameI').textContent=state.files[type]||'Sin archivo seleccionado'}function validateRet(){const r=$('retResult');if(!state.files.c||!state.files.i){r.className='notice';r.textContent='Debe adjuntar ambos archivos: C.RET e I.RET.';return}r.className='success';r.textContent='Ingreso validado correctamente. Se detectaron los dos archivos RET requeridos.'}
function stockPage(){const rows=SAMPLE.filter(x=>x.client===state.client);return `${pageHead('Stock y trazabilidad','Consulta por cliente, ZFI5, tránsito, ítem y subítem')}${state.mode==='internal'?clientSelector():''}<div class="card"><div class="filters three"><div class="field"><label>Buscar</label><input placeholder="ZFI5, tránsito o mercadería"></div><div class="field"><label>Estado</label><select><option>Todos</option><option>En stock</option><option>Parcial</option></select></div><button class="btn primary">Consultar</button></div><div class="table-wrap"><table><thead><tr><th>ZFI5</th><th>Tránsito</th><th>Ítem</th><th>Subítem</th><th>Mercadería</th><th>Cantidad</th><th>Estado</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.zfi5}</td><td>${x.transit}</td><td>${x.item}</td><td>${x.sub}</td><td>${x.goods}</td><td>${x.qty} ${x.unit}</td><td><span class="badge ${x.status==='En stock'?'ok':'warn'}">${x.status}</span></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No hay registros para el cliente seleccionado.</td></tr>'}</tbody></table></div></div>`}
function outcomePage(){return `${pageHead('Egresos y reexpediciones','Seguimiento de solicitudes, turnos y cancelaciones')}${state.mode==='internal'?clientSelector():''}<div class="card"><div class="filters"><div class="field"><label>ZFI5 a cancelar</label><input placeholder="Número de ZFI5"></div><div class="field"><label>Tipo</label><select><option>Reexpedición</option><option>Egreso nacional</option><option>Transferencia</option></select></div><div class="field"><label>Estado</label><select><option>Todos</option><option>Pendiente</option><option>Programado</option></select></div><button class="btn primary">Buscar</button></div><div class="table-wrap"><table><thead><tr><th>Solicitud</th><th>ZFI5</th><th>Ítem/Subítem</th><th>Fecha</th><th>Tipo</th><th>Estado</th></tr></thead><tbody><tr><td>EG-000248</td><td>19033ZFI5003067S</td><td>1 / 0</td><td>24/07/2026</td><td>Reexpedición</td><td><span class="badge warn">Pendiente</span></td></tr></tbody></table></div></div>`}
function zfi5Page(){return `${pageHead('ZFI5 y tránsitos','Consulta integrada de documentos y movimientos')}${state.mode==='internal'?clientSelector():''}<div class="card"><div class="filters three"><div class="field"><label>Número de documento</label><input placeholder="ZFI5 o TRM4"></div><div class="field"><label>Período</label><input type="month"></div><button class="btn primary">Consultar</button></div><div class="table-wrap"><table><thead><tr><th>Documento</th><th>Relacionado</th><th>Cliente</th><th>Fecha</th><th>Estado</th></tr></thead><tbody><tr><td>19033ZFI5003067S</td><td>19001TRM4002974F</td><td>EGT ARGENTINA S.A.</td><td>18/07/2026</td><td><span class="badge ok">Oficializado</span></td></tr></tbody></table></div></div>`}
function clientsPage(){return `${pageHead('Clientes y contratos','Alta, condiciones y configuración comercial')}<div class="card"><div class="toolbar"><button class="btn primary">Nuevo cliente</button><button class="btn ghost">Exportar</button></div><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Modalidad</th><th>Moneda</th><th>Almacenaje</th><th>Seguro</th><th>Estado</th></tr></thead><tbody>${Object.values(CLIENTS).map(c=>`<tr><td>${c.name}</td><td>${c.unit==='flat'?'Tarifa plana':c.unit.toUpperCase()+' / día'}</td><td>${c.currency}</td><td>${c.unit==='flat'?money(c.flat,c.currency):money(c.storage,c.currency)}</td><td>${c.insurance}% CIF</td><td><span class="badge ok">Activo</span></td></tr>`).join('')}</tbody></table></div></div>`}
function ratesPage(){return `${pageHead('Tarifas por cliente','Configuración individual de cada contrato')}${clientSelector()}<div class="card"><h2>${CLIENTS[state.client].name}</h2><div class="form-grid"><div class="field"><label>Unidad de almacenaje</label><select><option>${CLIENTS[state.client].unit==='flat'?'Tarifa plana':CLIENTS[state.client].unit.toUpperCase()}</option></select></div><div class="field"><label>Moneda</label><select><option>${CLIENTS[state.client].currency}</option></select></div><div class="field"><label>Tarifa de almacenaje</label><input value="${CLIENTS[state.client].storage||CLIENTS[state.client].flat}"></div><div class="field"><label>Mínimo de almacenaje</label><input value="${CLIENTS[state.client].minStorage}"></div><div class="field"><label>Seguro sobre CIF (%)</label><input value="${CLIENTS[state.client].insurance}"></div><div class="field"><label>Mínimo de seguro</label><input value="${CLIENTS[state.client].minInsurance}"></div><div class="field"><label>Ingreso</label><input value="${CLIENTS[state.client].income}"></div><div class="field"><label>Egreso</label><input value="${CLIENTS[state.client].outcome}"></div></div><div class="toolbar"><button class="btn primary">Guardar configuración</button></div></div>`}
function billingPage(){return `${pageHead('Facturación','Liquidaciones según contrato y moneda')}<div class="card"><div class="filters"><div class="field"><label>Cliente</label><select>${options(state.client)}</select></div><div class="field"><label>Período</label><input type="month"></div><div class="field"><label>Estado</label><select><option>Pendientes</option><option>Facturados</option></select></div><button class="btn primary">Liquidar</button></div><div class="notice">La liquidación toma la tarifa configurada para cada cliente: m², m³, tarifa plana, pesos o dólares.</div></div>`}
function accountsPage(){return `${pageHead('Cuentas corrientes','Saldos, comprobantes y vencimientos')}<div class="card"><div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Moneda</th><th>Saldo</th><th>Último comprobante</th><th>Estado</th></tr></thead><tbody>${Object.values(CLIENTS).slice(0,5).map((c,i)=>`<tr><td>${c.name}</td><td>${c.currency}</td><td>${money((i+1)*325,c.currency)}</td><td>FC-${String(i+1).padStart(5,'0')}</td><td><span class="badge ${i===2?'warn':'ok'}">${i===2?'A vencer':'Al día'}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function quotePage(){const c=CLIENTS[state.client];const unitLabel=c.unit==='m2'?'Superficie (m²)':c.unit==='m3'?'Volumen (m³)':'Tarifa plana contratada';return `${pageHead(state.mode==='client'?'Mi presupuesto':'Presupuesto por cliente','Simulación automática según la tarifa contractual')}${state.mode==='internal'?clientSelector():''}<div class="quote-layout"><div class="card"><h2>Datos de la operación</h2><div class="client-summary" style="margin-bottom:13px"><b>${c.name}</b><div class="small muted">${c.notes}</div></div><div class="form-grid"><div class="field"><label>Tipo de operación</label><select id="qType"><option value="full">Ingreso + almacenaje + egreso</option><option value="storage">Solo almacenaje</option><option value="income">Solo ingreso</option><option value="outcome">Solo egreso</option></select></div><div class="field"><label>Días de almacenaje</label><input id="qDays" type="number" min="0" value="15"></div><div class="field"><label>${unitLabel}</label><input id="qUnit" type="number" min="0" step="0.01" value="${c.unit==='flat'?4000:100}"></div><div class="field"><label>Valor CIF (${c.currency})</label><input id="qCif" type="number" min="0" step="0.01" value="10000"></div><div class="field"><label>Cantidad de ingresos</label><input id="qIncome" type="number" min="0" value="1"></div><div class="field"><label>Cantidad de egresos</label><input id="qOutcome" type="number" min="0" value="1"></div></div><div class="toolbar"><button id="calcQuote" class="btn primary">Calcular presupuesto</button><button class="btn ghost">Descargar PDF</button><button class="btn ghost">Enviar a JLG</button></div></div><div class="card"><h2>Resultado estimado</h2><div id="quoteResult"><div class="empty">Completá los datos y presioná “Calcular presupuesto”.</div></div></div></div>`}
function calculateQuote(){const c=CLIENTS[state.client],type=$('qType').value,days=+$('qDays').value||0,units=+$('qUnit').value||0,cif=+$('qCif').value||0,nIn=+$('qIncome').value||0,nOut=+$('qOutcome').value||0;let storage=0;if(type==='full'||type==='storage')storage=c.unit==='flat'?c.flat:Math.max(units*days*c.storage,c.minStorage);const insurance=Math.max(cif*(c.insurance/100),c.minInsurance);const income=(type==='full'||type==='income')?nIn*c.income:0;const outcome=(type==='full'||type==='outcome')?nOut*c.outcome:0;const total=storage+insurance+income+outcome;$('quoteResult').innerHTML=`<div class="small muted">Total estimado</div><div class="quote-total">${money(total,c.currency)}</div><div class="breakdown"><div class="break-row"><span>Almacenaje</span><b>${money(storage,c.currency)}</b></div><div class="break-row"><span>Seguro</span><b>${money(insurance,c.currency)}</b></div><div class="break-row"><span>Ingresos</span><b>${money(income,c.currency)}</b></div><div class="break-row"><span>Egresos</span><b>${money(outcome,c.currency)}</b></div></div><div class="notice" style="margin-top:14px">Presupuesto estimativo sujeto a validación de JLG. No incluye SENASA ni gastos extraordinarios.</div>`}
function docsPage(){return `${pageHead('Documentación','Repositorio de comprobantes y archivos operativos')}${state.mode==='internal'?clientSelector():''}<div class="card"><div class="filters three"><div class="field"><label>Tipo de documento</label><select><option>Todos</option><option>RET</option><option>ZFI5</option><option>Factura</option><option>Comprobante</option></select></div><div class="field"><label>Buscar</label><input placeholder="Número o referencia"></div><button class="btn primary">Consultar</button></div><div class="table-wrap"><table><thead><tr><th>Archivo</th><th>Tipo</th><th>Operación</th><th>Fecha</th><th>Acción</th></tr></thead><tbody><tr><td>19033ZFI5003067S.pdf</td><td>ZFI5</td><td>Ingreso EGT</td><td>18/07/2026</td><td><button class="btn soft">Ver</button></td></tr></tbody></table></div></div>`}
function go(page){state.page=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();closeMenu()}window.go=go;function closeMenu(){$('sidebar').classList.remove('open');$('scrim').classList.add('hidden')}function setRole(mode){state.mode=mode;$('roleInternal').classList.toggle('active',mode==='internal');$('roleClient').classList.toggle('active',mode==='client');$('clientLoginField').classList.toggle('hidden',mode!=='client')}function enter(){if($('password').value!=='demo123'){alert('Contraseña incorrecta. Usá demo123.');return}if(state.mode==='client')state.client=$('clientLogin').value;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('environment').textContent=state.mode==='internal'?'Gestión interna':'Portal del cliente';$('userPill').textContent=state.mode==='internal'?'Karen · Administradora':CLIENTS[state.client].name;document.querySelectorAll('.internal-only').forEach(x=>x.classList.toggle('hidden',state.mode!=='internal'));state.page='home';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='home'));render()}function logout(){$('app').classList.add('hidden');$('login').classList.remove('hidden');closeMenu()}function init(){$('clientLogin').innerHTML=options('EGT');$('roleInternal').addEventListener('click',()=>setRole('internal'));$('roleClient').addEventListener('click',()=>setRole('client'));$('loginBtn').addEventListener('click',enter);$('logoutBtn').addEventListener('click',logout);$('profileBtn').addEventListener('click',logout);$('menuBtn').addEventListener('click',()=>{$('sidebar').classList.toggle('open');$('scrim').classList.toggle('hidden')});$('scrim').addEventListener('click',closeMenu);document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)))}init();
</script>
