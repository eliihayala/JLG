<style>
:root{--navy:#0a2738;--blue:#2aa7d7;--sky:#7bd2ef;--bg:#f3f7f9;--card:#fff;--ink:#183646;--muted:#6f8490;--line:#dce7ec;--ok:#1f7c62;--warn:#a76b0d;--bad:#b34646;--shadow:0 10px 28px rgba(14,50,70,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:750}.primary{background:linear-gradient(135deg,#1687bd,#34b4e3);color:#fff}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.soft{background:#eaf8fd;color:#126c97}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.ok{background:#e8f5ef;color:var(--ok)}.warn{background:#fff2da;color:var(--warn)}.info{background:#e8f7fc;color:#1975a0}.login{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr;background:#fff}.login-visual{display:grid;place-items:center;padding:46px;background:linear-gradient(145deg,#59c6eb,#218dbf)}.login-visual img{width:min(520px,82%);filter:drop-shadow(0 24px 38px rgba(12,56,78,.28))}.login-side{display:grid;place-items:center;padding:34px}.login-box{width:min(440px,100%)}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#1c80ac;font-weight:850}.login h1{font-size:34px;line-height:1.12;margin:10px 0}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #cddde5;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink)}textarea{min-height:92px;resize:vertical}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.role{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;text-align:left}.role.active{border-color:#77cae8;background:#edf9fd}.role small{display:block;color:var(--muted);margin-top:4px}.topbar{height:68px;position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 18px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover}.brand b,.brand small{display:block}.brand small{opacity:.72}.top-actions{display:flex;align-items:center;gap:8px}.pill{border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 11px;font-size:13px}.menu-btn{display:none}.shell{display:grid;grid-template-columns:275px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{background:#0d2f41;color:#d6e7ef;padding:15px 12px}.nav{display:grid;gap:4px}.nav-title,.group{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#89a8b8;padding:5px 10px}.group{padding-top:14px;color:#6f93a4}.nav button{border:0;background:transparent;color:#cce0e9;text-align:left;border-radius:9px;padding:10px 11px;font-size:14px}.nav button:hover{background:rgba(255,255,255,.06)}.nav button.active{background:rgba(76,190,229,.17);color:#fff;font-weight:800;border-left:3px solid var(--sky)}.main{padding:22px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:17px}.page-head h1{margin:0;font-size:25px}.page-head p{margin:4px 0 0}.card,.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.card{padding:16px}.card h2{margin:0 0 9px;font-size:18px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.kpi{padding:16px}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:27px;font-weight:850;margin-top:5px}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.hero{background:linear-gradient(115deg,#0a2a3b,#1576a0);color:#fff;border-radius:15px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.hero .muted{color:rgba(255,255,255,.72)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:1/-1}.filters{display:grid;grid-template-columns:1.2fr 1.2fr 1fr 1fr auto;gap:9px;margin-top:13px}.table-wrap{overflow:auto;border:1px solid #e3edf2;border-radius:12px;margin-top:13px;max-height:560px}table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}th,td{padding:10px 11px;border-bottom:1px solid #e7eef2;text-align:left;white-space:nowrap}th{background:#f5fafc;color:#526a78;font-size:12px;position:sticky;top:0;z-index:1}tbody tr:hover{background:#f8fbfd}.notice{padding:13px;border-radius:11px;background:#fff4df;border:1px solid #efd79e;color:#79540e}.success{padding:13px;border-radius:11px;background:#e7f5ef;border:1px solid #bde0d3;color:#17634c}.upload{border:2px dashed #b8d7e4;border-radius:14px;padding:18px;background:#f8fcfe}.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.upload-box{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.file-status{margin-top:8px;font-size:12px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.summary>div{background:#f7fbfd;border:1px solid var(--line);border-radius:12px;padding:12px}.summary span{display:block;font-size:11px;color:var(--muted)}.summary b{font-size:18px}.section-gap{margin-top:14px}.right{text-align:right}.scrim{display:none}@media(max-width:1050px){.menu-btn{display:inline-flex}.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:68px;bottom:0;width:min(310px,86vw);z-index:40;transform:translateX(-105%);transition:.2s;overflow:auto}.sidebar.open{transform:translateX(0)}.scrim{display:block;position:fixed;inset:68px 0 0;background:rgba(0,0,0,.28);z-index:35}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.main{padding:17px}}@media(max-width:680px){.login{grid-template-columns:1fr}.login-visual{display:none}.roles,.kpis,.form-grid,.upload-grid,.summary,.filters{grid-template-columns:1fr}.topbar{align-items:flex-start;height:auto;min-height:68px}.brand small,.pill{display:none}.page-head,.hero{flex-direction:column;align-items:flex-start}.main{padding:13px}.form-grid .wide{grid-column:auto}}
</style>

<body>
<section id="login" class="login"><div class="login-visual"><img src="jlg-logo.png" alt="Logo JLG"></div><div class="login-side"><div class="login-box"><div class="eyebrow">Gestión logística y Zona Franca</div><h1>JLG Control</h1><p class="muted">Operaciones, trazabilidad, contratos y presupuestos en una sola plataforma.</p><div class="field"><label>Usuario</label><input id="username" value="karen@jlg.com.ar"></div><div class="field"><label>Contraseña</label><input id="password" type="password" value="demo123"></div><div class="roles"><button id="internalRole" class="role active"><b>Gestión interna</b><small>Personal de JLG</small></button><button id="clientRole" class="role"><b>Portal del cliente</b><small>Consulta y presupuesto</small></button></div><div id="loginClientBox" class="field hidden"><label>Empresa</label><select id="loginClient"></select></div><button id="loginButton" class="btn primary" style="width:100%;margin-top:18px">Ingresar</button><div id="loginError" class="small" style="color:#b34646;margin-top:9px"></div></div></div></section>
<section id="app" class="hidden"><header class="topbar"><div class="brand"><button id="menuButton" class="btn ghost menu-btn">☰</button><img src="jlg-logo.png" alt="JLG"><div><b>JLG Control</b><small id="environment">Gestión interna</small></div></div><div class="top-actions"><span id="userPill" class="pill">Karen · Administradora</span><button id="logout" class="btn ghost">Salir</button></div></header><div class="shell"><aside id="sidebar" class="sidebar"><div id="nav" class="nav"></div></aside><main id="main" class="main"></main></div><div id="scrim" class="scrim hidden"></div></section>
<script>
const clients={EGT:{name:'EGT ARGENTINA S.A.',mode:'m3',currency:'USD',rate:1.10,min:160000,insurance:.08,insuranceMin:45000},Yamaha:{name:'YAMAHA MOTOR ARGENTINA S.A.',mode:'m3',currency:'USD',rate:1.25,min:160000,insurance:.08,insuranceMin:45000},ZMG:{name:'ZMG ARGENTINA S.R.L.',mode:'flat',currency:'USD',rate:4000,min:0,insurance:.08,insuranceMin:45000},Ferrum:{name:'FERRUM S.A.',mode:'m2',currency:'ARS',rate:620,min:160000,insurance:.08,insuranceMin:45000},Cetrogar:{name:'CETROGAR S.A.',mode:'m3',currency:'ARS',rate:588,min:160000,insurance:.08,insuranceMin:45000},Pampa:{name:'PAMPA',mode:'m2',currency:'USD',rate:.90,min:0,insurance:.08,insuranceMin:45000},Logexpor:{name:'LOGEXPOR',mode:'m3',currency:'ARS',rate:588,min:160000,insurance:.08,insuranceMin:45000},Bracol:{name:'BRACOL',mode:'m2',currency:'USD',rate:.75,min:0,insurance:.08,insuranceMin:45000}};
const stock=[{client:'EGT',zfi5:'26033ZFI5001245A',transit:'TRM4-98741',item:'1',subitem:'1.1',article:'Bomba centrífuga BC-220',brand:'EGT',units:120,packages:24,m3:18.40,kg:6840,location:'Fresnos A-01',status:'Disponible'},{client:'EGT',zfi5:'26033ZFI5001245A',transit:'TRM4-98741',item:'1',subitem:'1.2',article:'Motor eléctrico 7.5 HP',brand:'WEG',units:80,packages:16,m3:12.10,kg:4320,location:'Fresnos A-02',status:'Disponible'},{client:'EGT',zfi5:'26033ZFI5001245A',transit:'TRM4-98741',item:'2',subitem:'2.1',article:'Tablero de control industrial',brand:'Schneider',units:40,packages:10,m3:7.85,kg:1980,location:'Fresnos A-03',status:'Disponible'},{client:'EGT',zfi5:'26033ZFI5001299B',transit:'TRM4-99118',item:'1',subitem:'1.1',article:'Válvula mariposa 4 pulgadas',brand:'Bray',units:250,packages:25,m3:14.65,kg:3750,location:'Palmeras P-04',status:'Disponible'},{client:'EGT',zfi5:'26033ZFI5001299B',transit:'TRM4-99118',item:'2',subitem:'2.1',article:'Kit de juntas industriales',brand:'Garlock',units:500,packages:20,m3:5.20,kg:860,location:'Palmeras P-05',status:'Disponible'},{client:'Yamaha',zfi5:'26033ZFI5001301C',transit:'TRM4-99221',item:'1',subitem:'1.1',article:'Motocicleta modelo FZ',brand:'Yamaha',units:60,packages:60,m3:102,kg:8400,location:'Depósito 1',status:'Disponible'},{client:'Pampa',zfi5:'26033ZFI5001330D',transit:'TRM4-99500',item:'1',subitem:'1.1',article:'Estructura metálica modular',brand:'Pampa',units:42,packages:42,m3:88.5,kg:12000,location:'Playa Murúa',status:'Disponible'}];
const zfi5s=[{client:'EGT',zfi5:'26033ZFI5001245A',transit:'TRM4-98741',date:'12/07/2026',items:3,units:240,m3:38.35,status:'Con saldo'},{client:'EGT',zfi5:'26033ZFI5001299B',transit:'TRM4-99118',date:'18/07/2026',items:2,units:750,m3:19.85,status:'Con saldo'},{client:'Yamaha',zfi5:'26033ZFI5001301C',transit:'TRM4-99221',date:'19/07/2026',items:1,units:60,m3:102,status:'Con saldo'},{client:'Pampa',zfi5:'26033ZFI5001330D',transit:'TRM4-99500',date:'21/07/2026',items:1,units:42,m3:88.5,status:'Con saldo'}];
let state={role:'internal',client:'EGT',module:'inicio'};const $=id=>document.getElementById(id);const clientOptions=()=>Object.entries(clients).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');$('loginClient').innerHTML=clientOptions();$('internalRole').onclick=()=>{state.role='internal';$('internalRole').classList.add('active');$('clientRole').classList.remove('active');$('loginClientBox').classList.add('hidden')};$('clientRole').onclick=()=>{state.role='client';$('clientRole').classList.add('active');$('internalRole').classList.remove('active');$('loginClientBox').classList.remove('hidden')};$('loginButton').onclick=()=>{if($('password').value!=='demo123'){$('loginError').textContent='Contraseña incorrecta.';return}state.client=$('loginClient').value;state.module='inicio';$('login').classList.add('hidden');$('app').classList.remove('hidden');$('environment').textContent=state.role==='internal'?'Gestión interna':'Portal del cliente';$('userPill').textContent=state.role==='internal'?'Karen · Administradora':clients[state.client].name;renderNav();render()};$('logout').onclick=()=>location.reload();$('menuButton').onclick=()=>{$('sidebar').classList.toggle('open');$('scrim').classList.toggle('hidden')};$('scrim').onclick=()=>{$('sidebar').classList.remove('open');$('scrim').classList.add('hidden')};
function renderNav(){const internal=[['Operaciones',''],['inicio','⌂ Inicio'],['ingresos','⇩ Nuevo ingreso RET'],['stock','▦ Stock y trazabilidad'],['egresos','⇧ Egresos y remisiones'],['zfi5','⇄ ZFI5 y tránsitos'],['Administración',''],['clientes','◉ Clientes y contratos'],['tarifas','$ Tarifas por cliente'],['facturacion','▤ Facturación'],['cuentas','≋ Cuenta corriente']];const portal=[['Portal',''],['inicio','⌂ Inicio'],['stock','▦ Mi stock'],['zfi5','⇄ Mis ZFI5 y tránsitos'],['presupuesto','$ Mi presupuesto']];const items=state.role==='internal'?internal:portal;$('nav').innerHTML='<div class="nav-title">JLG Control</div>'+items.map(x=>x[1]?`<button data-module="${x[0]}" class="${state.module===x[0]?'active':''}">${x[1]}</button>`:`<div class="group">${x[0]}</div>`).join('');document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{state.module=b.dataset.module;renderNav();render();$('sidebar').classList.remove('open');$('scrim').classList.add('hidden')})}
function head(title,desc,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p class="muted">${desc}</p></div><div>${actions}</div></div>`}function clientSelect(id,label='Cliente'){return `<div class="field" style="margin:0"><label>${label}</label><select id="${id}">${clientOptions()}</select></div>`}function render(){const fn=views[state.module]||views.inicio;$('main').innerHTML=fn();bind()}
const views={inicio(){const c=clients[state.client];if(state.role==='client')return head('Inicio','Resumen operativo de '+c.name)+`<div class="hero"><div><h2 style="margin:0 0 5px">Bienvenido al portal de JLG</h2><div class="muted">Consultá stock, ZFI5, tránsitos y generá presupuestos con tu tarifa.</div></div><span class="badge info">${c.currency} · ${c.mode==='m2'?'por m²':c.mode==='m3'?'por m³':'tarifa plana'}</span></div><div class="kpis section-gap"><div class="kpi"><div class="label">Unidades disponibles</div><div class="value">${sum(stock.filter(x=>x.client===state.client),'units')}</div></div><div class="kpi"><div class="label">Volumen</div><div class="value">${sum(stock.filter(x=>x.client===state.client),'m3').toFixed(2)} m³</div></div><div class="kpi"><div class="label">ZFI5 con saldo</div><div class="value">${zfi5s.filter(x=>x.client===state.client).length}</div></div><div class="kpi"><div class="label">Operaciones pendientes</div><div class="value">2</div></div></div>`;return head('Inicio','Panel general de la operación')+`<div class="hero"><div><h2 style="margin:0 0 5px">Operación JLG al día</h2><div class="muted">Alertas, documentación y movimientos pendientes.</div></div><button class="btn ghost" data-go="ingresos">Nuevo ingreso</button></div><div class="kpis section-gap"><div class="kpi"><div class="label">Ingresos pendientes</div><div class="value">6</div></div><div class="kpi"><div class="label">Retiros programados</div><div class="value">4</div></div><div class="kpi"><div class="label">ZFI5 con saldo</div><div class="value">${zfi5s.length}</div></div><div class="kpi"><div class="label">Alertas de facturación</div><div class="value">3</div></div></div><div class="grid2"><div class="card"><h2>Alertas operativas</h2><div class="notice">Hay 2 operaciones con documentación pendiente de validación.</div></div><div class="card"><h2>Accesos rápidos</h2><div class="toolbar"><button class="btn soft" data-go="stock">Consultar stock</button><button class="btn soft" data-go="egresos">Registrar egreso</button><button class="btn soft" data-go="clientes">Alta de cliente</button></div></div></div>`},
ingresos(){return head('Nuevo ingreso RET','Carga interna de los dos archivos RET obligatorios')+`<div class="card"><div class="form-grid">${clientSelect('loadClient','Cliente a cargar')}<div class="field" style="margin:0"><label>Número de tránsito</label><input id="retTransit" placeholder="TRM4-..."></div><div class="field" style="margin:0"><label>ZFI5 relacionado</label><input id="retZfi" placeholder="26033ZFI5..."></div><div class="field" style="margin:0"><label>Fecha de ingreso</label><input type="date" id="retDate"></div></div><div class="upload section-gap"><div class="upload-grid"><div class="upload-box"><b>Archivo C.RET</b><p class="muted small">Cabecera del ingreso</p><input type="file" id="retC" accept=".ret,.txt"><div id="retCStatus" class="file-status muted">Sin archivo seleccionado</div></div><div class="upload-box"><b>Archivo I.RET</b><p class="muted small">Ítems y subítems</p><input type="file" id="retI" accept=".ret,.txt"><div id="retIStatus" class="file-status muted">Sin archivo seleccionado</div></div></div></div><div class="field"><label>Observaciones internas</label><textarea id="retObs"></textarea></div><div class="toolbar"><button id="validateRet" class="btn primary">Validar y cargar ingreso</button></div><div id="retMessage" class="section-gap"></div></div>`},
stock(){return head(state.role==='client'?'Mi stock':'Stock y trazabilidad','Búsqueda por ZFI5, tránsito, artículo o marca',`<div class="toolbar"><button id="exportCsv" class="btn ghost">Descargar Excel</button><button id="exportPdf" class="btn ghost">Descargar PDF</button></div>`)+`<div class="card">${state.role==='internal'?clientSelect('stockClient','Cliente de consulta'):''}<div class="filters"><input id="fZfi" placeholder="ZFI5"><input id="fTransit" placeholder="Tránsito"><input id="fArticle" placeholder="Artículo"><input id="fBrand" placeholder="Marca"><button id="searchStock" class="btn primary">Buscar</button></div><div id="stockSummary" class="summary"></div><div id="stockTable"></div></div>`},
egresos(){return head('Egresos y remisiones','Cancelación parcial o total por ZFI5, ítem y artículo')+`<div class="card"><div class="form-grid">${clientSelect('exitClient','Cliente')}<div class="field" style="margin:0"><label>ZFI5 a cancelar</label><select id="exitZfi"></select></div><div class="field" style="margin:0"><label>Número de remisión</label><input id="remission" placeholder="REM-000123"></div><div class="field" style="margin:0"><label>Número de ZF / destinación</label><input id="exitDest" placeholder="ZFE1 / ZFTR / ..."></div></div><div id="exitItems" class="table-wrap"></div><div class="field"><label>Observaciones para facturación u operación</label><textarea id="exitObs" placeholder="Ej.: facturar almacenaje total antes del retiro..."></textarea></div><div class="toolbar"><button id="validateExit" class="btn primary">Validar retiro</button></div><div id="exitMessage" class="section-gap"></div></div>`},
zfi5(){return head(state.role==='client'?'Mis ZFI5 y tránsitos':'ZFI5 y tránsitos','Consulta de documentos, cantidades y saldos')+`<div class="card">${state.role==='internal'?clientSelect('zfiClient','Cliente de consulta'):''}<div class="filters" style="grid-template-columns:1fr 1fr auto"><input id="zfiSearch" placeholder="Buscar ZFI5"><input id="transitSearch" placeholder="Buscar tránsito"><button id="searchZfi" class="btn primary">Buscar</button></div><div id="zfiTable"></div></div>`},
clientes(){return head('Clientes y contratos','Alta y mantenimiento completo de clientes')+`<div class="card"><div class="form-grid"><div class="field" style="margin:0"><label>Razón social</label><input></div><div class="field" style="margin:0"><label>CUIT</label><input></div><div class="field" style="margin:0"><label>Nombre comercial</label><input></div><div class="field" style="margin:0"><label>Estado</label><select><option>Activo</option><option>En alta</option><option>Inactivo</option></select></div><div class="field" style="margin:0"><label>Domicilio legal</label><input></div><div class="field" style="margin:0"><label>Localidad / Provincia</label><input></div><div class="field" style="margin:0"><label>Contacto operativo</label><input></div><div class="field" style="margin:0"><label>Correo operativo</label><input type="email"></div><div class="field" style="margin:0"><label>Contacto administrativo</label><input></div><div class="field" style="margin:0"><label>Correo de facturación</label><input type="email"></div><div class="field" style="margin:0"><label>Teléfono</label><input></div><div class="field" style="margin:0"><label>Condición IVA</label><select><option>Responsable inscripto</option><option>Exento</option><option>Monotributo</option><option>Exterior</option></select></div><div class="field" style="margin:0"><label>Fecha de alta</label><input type="date"></div><div class="field" style="margin:0"><label>Vigencia del contrato</label><input placeholder="Desde / hasta"></div><div class="field" style="margin:0"><label>Unidad funcional / depósito</label><input></div><div class="field" style="margin:0"><label>Tipo de mercadería autorizada</label><input></div><div class="field wide" style="margin:0"><label>Documentación societaria y fiscal</label><textarea placeholder="Estatuto, poder, constancia ARCA, IIBB, seguros, habilitaciones..."></textarea></div><div class="field wide" style="margin:0"><label>Condiciones del contrato</label><textarea placeholder="Plazos de pago, mínimos, seguros, responsabilidades, documentación, retiro y facturación..."></textarea></div><div class="field wide" style="margin:0"><label>Observaciones internas</label><textarea></textarea></div></div><div class="toolbar"><button class="btn primary">Guardar cliente</button><button class="btn ghost">Adjuntar documentación</button></div></div>`},
tarifas(){return head('Tarifas por cliente','Configuración individual por unidad, moneda y conceptos')+`<div class="card"><div class="form-grid">${clientSelect('rateClient','Cliente')}<div class="field" style="margin:0"><label>Modalidad</label><select id="rateMode"><option value="m2">Por m² por día</option><option value="m3">Por m³ por día</option><option value="flat">Tarifa plana</option></select></div><div class="field" style="margin:0"><label>Moneda</label><select id="rateCurrency"><option>ARS</option><option>USD</option></select></div><div class="field" style="margin:0"><label>Valor de tarifa</label><input id="rateValue" type="number" step="0.01"></div><div class="field" style="margin:0"><label>Mínimo de almacenaje</label><input id="rateMin" type="number" step="0.01"></div><div class="field" style="margin:0"><label>Seguro % CIF mensual</label><input id="rateInsurance" type="number" step="0.01"></div><div class="field" style="margin:0"><label>Mínimo de seguro</label><input id="rateInsuranceMin" type="number" step="0.01"></div><div class="field" style="margin:0"><label>Tarifa de ingreso</label><input type="number"></div><div class="field" style="margin:0"><label>Tarifa de egreso</label><input type="number"></div><div class="field wide" style="margin:0"><label>Conceptos especiales</label><textarea></textarea></div></div><div class="toolbar"><button class="btn primary">Guardar tarifa</button></div></div>`},
presupuesto(){return head('Mi presupuesto','Cálculo según la tarifa contratada por '+clients[state.client].name)+budgetForm()},facturacion(){return head('Facturación','Módulo reservado para la próxima etapa')+`<div class="card"><div class="notice">La estructura de facturación se definirá después.</div></div>`},cuentas(){return head('Cuenta corriente','Módulo reservado para la próxima etapa')+`<div class="card"><div class="notice">La cuenta corriente se integrará con facturación.</div></div>`}};
function budgetForm(){const c=clients[state.client];return `<div class="card"><div class="notice">Tarifa configurada: <b>${c.mode==='m2'?'por m² por día':c.mode==='m3'?'por m³ por día':'tarifa plana'}</b> · ${c.currency}</div><div class="form-grid section-gap"><div class="field" style="margin:0"><label>Tipo de operación</label><select id="budgetType"><option>Ingreso + almacenaje + egreso</option><option>Solo almacenaje</option><option>Ingreso</option><option>Egreso</option></select></div><div class="field" style="margin:0"><label>Días de almacenaje</label><input id="budgetDays" type="number" value="15"></div><div class="field" style="margin:0"><label>${c.mode==='m2'?'Metros cuadrados':c.mode==='m3'?'Metros cúbicos':'Superficie ocupada informativa'}</label><input id="budgetQty" type="number" value="100"></div><div class="field" style="margin:0"><label>Valor CIF</label><input id="budgetCif" type="number" value="10000"></div><div class="field" style="margin:0"><label>Cantidad de ingresos</label><input id="budgetIn" type="number" value="1"></div><div class="field" style="margin:0"><label>Cantidad de egresos</label><input id="budgetOut" type="number" value="1"></div></div><div class="toolbar"><button id="calcBudget" class="btn primary">Calcular presupuesto</button></div><div id="budgetResult" class="section-gap"></div></div>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.module=b.dataset.go;renderNav();render()});if($('retC')){$('retC').onchange=e=>$('retCStatus').textContent=e.target.files[0]?.name||'Sin archivo seleccionado';$('retI').onchange=e=>$('retIStatus').textContent=e.target.files[0]?.name||'Sin archivo seleccionado';$('validateRet').onclick=()=>{const c=$('retC').files.length,i=$('retI').files.length;$('retMessage').innerHTML=c&&i?'<div class="success">Ingreso validado: se recibieron C.RET e I.RET.</div>':'<div class="notice">Deben adjuntarse los dos archivos: C.RET e I.RET.</div>'}}if($('stockTable')){if($('stockClient'))$('stockClient').value=state.client;renderStock();$('searchStock').onclick=renderStock;if($('stockClient'))$('stockClient').onchange=renderStock;$('exportCsv').onclick=exportStockCsv;$('exportPdf').onclick=()=>window.print()}if($('exitClient')){$('exitClient').value=state.client;fillExitZfi();$('exitClient').onchange=fillExitZfi;$('exitZfi').onchange=renderExitItems;$('validateExit').onclick=validateExit}if($('zfiTable')){if($('zfiClient'))$('zfiClient').value=state.client;renderZfi();$('searchZfi').onclick=renderZfi;if($('zfiClient'))$('zfiClient').onchange=renderZfi}if($('rateClient')){fillRate();$('rateClient').onchange=fillRate}if($('calcBudget'))$('calcBudget').onclick=calcBudget}
function sum(arr,key){return arr.reduce((a,b)=>a+Number(b[key]||0),0)}function stockFiltered(){const client=state.role==='client'?state.client:($('stockClient')?.value||state.client);const q=id=>(($(id)?.value)||'').toLowerCase();return stock.filter(x=>x.client===client&&x.zfi5.toLowerCase().includes(q('fZfi'))&&x.transit.toLowerCase().includes(q('fTransit'))&&x.article.toLowerCase().includes(q('fArticle'))&&x.brand.toLowerCase().includes(q('fBrand')))}
function renderStock(){const rows=stockFiltered();$('stockSummary').innerHTML=`<div><span>Registros</span><b>${rows.length}</b></div><div><span>Unidades</span><b>${sum(rows,'units')}</b></div><div><span>Bultos</span><b>${sum(rows,'packages')}</b></div><div><span>Volumen</span><b>${sum(rows,'m3').toFixed(2)} m³</b></div>`;$('stockTable').innerHTML=`<div class="table-wrap"><table><thead><tr><th>ZFI5</th><th>Tránsito</th><th>Ítem</th><th>Subítem</th><th>Artículo</th><th>Marca</th><th>Unidades</th><th>Bultos</th><th>m³</th><th>Kg</th><th>Ubicación</th><th>Estado</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.zfi5}</td><td>${x.transit}</td><td>${x.item}</td><td>${x.subitem}</td><td>${x.article}</td><td>${x.brand}</td><td>${x.units}</td><td>${x.packages}</td><td>${x.m3.toFixed(2)}</td><td>${x.kg}</td><td>${x.location}</td><td><span class="badge ok">${x.status}</span></td></tr>`).join('')||'<tr><td colspan="12">Sin resultados</td></tr>'}</tbody></table></div>`}
function exportStockCsv(){const rows=stockFiltered(),heads=['ZFI5','Transito','Item','Subitem','Articulo','Marca','Unidades','Bultos','m3','Kg','Ubicacion','Estado'];const csv=[heads.join(';'),...rows.map(x=>[x.zfi5,x.transit,x.item,x.subitem,x.article,x.brand,x.units,x.packages,x.m3,x.kg,x.location,x.status].join(';'))].join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stock-jlg.csv';a.click();URL.revokeObjectURL(a.href)}
function fillExitZfi(){const c=$('exitClient').value,arr=[...new Set(stock.filter(x=>x.client===c).map(x=>x.zfi5))];$('exitZfi').innerHTML=arr.map(z=>`<option>${z}</option>`).join('');renderExitItems()}function renderExitItems(){const z=$('exitZfi').value,rows=stock.filter(x=>x.zfi5===z);$('exitItems').innerHTML=`<table><thead><tr><th>Ítem</th><th>Subítem</th><th>Artículo</th><th>Marca</th><th>Disponible</th><th>Cantidad a cancelar</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.item}</td><td>${x.subitem}</td><td>${x.article}</td><td>${x.brand}</td><td>${x.units}</td><td><input class="cancelQty" data-max="${x.units}" type="number" min="0" max="${x.units}" value="0" style="width:140px"></td></tr>`).join('')}</tbody></table>`}function validateExit(){const vals=[...document.querySelectorAll('.cancelQty')],invalid=vals.some(x=>Number(x.value)<0||Number(x.value)>Number(x.dataset.max)),total=vals.reduce((a,x)=>a+Number(x.value||0),0);$('exitMessage').innerHTML=invalid?'<div class="notice">Hay cantidades superiores al stock disponible.</div>':!$('remission').value||!$('exitDest').value||total===0?'<div class="notice">Completá remisión, número de ZF/destinación y alguna cantidad.</div>':'<div class="success">Retiro validado. Total a cancelar: '+total+' unidades.</div>'}
function renderZfi(){const c=state.role==='client'?state.client:($('zfiClient')?.value||state.client),a=($('zfiSearch')?.value||'').toLowerCase(),b=($('transitSearch')?.value||'').toLowerCase(),rows=zfi5s.filter(x=>x.client===c&&x.zfi5.toLowerCase().includes(a)&&x.transit.toLowerCase().includes(b));$('zfiTable').innerHTML=`<div class="table-wrap"><table><thead><tr><th>ZFI5</th><th>Tránsito</th><th>Fecha</th><th>Ítems</th><th>Unidades</th><th>m³</th><th>Estado</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.zfi5}</td><td>${x.transit}</td><td>${x.date}</td><td>${x.items}</td><td>${x.units}</td><td>${x.m3.toFixed(2)}</td><td><span class="badge ok">${x.status}</span></td></tr>`).join('')||'<tr><td colspan="7">Sin resultados</td></tr>'}</tbody></table></div>`}
function fillRate(){const c=clients[$('rateClient').value];$('rateMode').value=c.mode;$('rateCurrency').value=c.currency;$('rateValue').value=c.rate;$('rateMin').value=c.min;$('rateInsurance').value=c.insurance;$('rateInsuranceMin').value=c.insuranceMin}function calcBudget(){const c=clients[state.client],days=Number($('budgetDays').value||0),qty=Number($('budgetQty').value||0),cif=Number($('budgetCif').value||0),ins=Number($('budgetIn').value||0),outs=Number($('budgetOut').value||0);let storage=c.mode==='flat'?c.rate:c.rate*qty*days;if(c.currency==='ARS'&&c.min)storage=Math.max(storage,c.min);const insurance=Math.max(cif*(c.insurance/100)*(days/30),c.currency==='ARS'?c.insuranceMin:0),ingreso=ins*100,egreso=outs*100,total=storage+insurance+ingreso+egreso;$('budgetResult').innerHTML=`<div class="success"><b>Presupuesto estimado</b></div><div class="summary"><div><span>Almacenaje</span><b>${fmt(storage,c.currency)}</b></div><div><span>Seguro</span><b>${fmt(insurance,c.currency)}</b></div><div><span>Ingreso</span><b>${fmt(ingreso,c.currency)}</b></div><div><span>Egreso</span><b>${fmt(egreso,c.currency)}</b></div></div><div class="card section-gap" style="box-shadow:none"><div class="right"><span class="muted">Total estimado</span><div style="font-size:30px;font-weight:850">${fmt(total,c.currency)}</div></div><p class="muted small">Estimación sujeta a validación de JLG. No incluye SENASA ni conceptos extraordinarios.</p></div>`}function fmt(n,c){return new Intl.NumberFormat('es-AR',{style:'currency',currency:c,maximumFractionDigits:2}).format(n)}
</script></body></html>
