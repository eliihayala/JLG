<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JLG Control</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f3f7f9;color:#173747}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.hero{background:linear-gradient(145deg,#59c7eb,#218dbf);display:grid;place-items:center}.hero img{width:70%;max-width:460px}.loginbox{display:grid;place-items:center;padding:30px}.box{width:min(420px,100%)}.muted{color:#6d8290}.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.role,.btn{border:1px solid #dbe7ec;border-radius:10px;padding:11px;background:#fff;cursor:pointer}.role.active{background:#eaf8fd;border-color:#72c9e8}.primary{background:#1699d2;color:#fff;border:0;font-weight:700}label{display:block;font-size:12px;font-weight:700;color:#6d8290;margin:12px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cadbe3;border-radius:10px;background:#fff}.top{height:68px;background:#0b2d40;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 18px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:10px}.shell{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 68px)}aside{background:#0d3448;padding:14px 10px}.nav button{display:block;width:100%;border:0;background:transparent;color:#d7e7ee;text-align:left;padding:10px;border-radius:9px;cursor:pointer}.nav button.active{background:rgba(80,190,230,.18);border-left:3px solid #65caed;color:#fff;font-weight:700}main{padding:20px}.card{background:#fff;border:1px solid #dbe7ec;border-radius:15px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi span{display:block;color:#6d8290;font-size:12px}.kpi b{font-size:26px}.table{overflow:auto;border:1px solid #dbe7ec;border-radius:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e6eef2;text-align:left;white-space:nowrap}th{background:#f5fafc}.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.ok{background:#e6f4ee;color:#1d7d62}.warn{background:#fff2d9;color:#a56a0b}.bad{background:#fde8e8;color:#b54343}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}@media(max-width:900px){.login{grid-template-columns:1fr}.hero{display:none}.shell{grid-template-columns:1fr}.grid,.form{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><section id="login" class="login"><div class="hero"><img src="jlg-logo.png"></div><div class="loginbox"><div class="box"><p class="muted">JLG LOGISTIC GROUP</p><h1>Control operativo</h1><p class="muted">Gestión interna y portal de clientes.</p><div class="roles"><button class="role active" data-role="admin"><b>Gestión interna</b><br><small>Operaciones JLG</small></button><button class="role" data-role="client"><b>Portal cliente</b><br><small>Solo consulta</small></button></div><label>Cliente</label><select id="client" disabled><option>EGT</option><option>Yamaha</option><option>ZMG</option><option>Pampa</option></select><label>Contraseña</label><input id="pass" type="password" value="demo123"><button id="enter" class="btn primary" style="width:100%;margin-top:14px">Ingresar</button><p id="err" class="hidden bad" style="padding:8px;border-radius:8px"></p></div></div></section><section id="app" class="hidden"><header class="top"><div class="brand"><img src="jlg-logo.png"><div><b>JLG Control</b><small id="mode" style="display:block;opacity:.7">Gestión interna</small></div></div><button class="btn" onclick="location.reload()">Salir</button></header><div class="shell"><aside><div id="nav" class="nav"><button class="active" data-p="home">Inicio</button><button class="admin" data-p="ret">Ingreso de RET</button><button data-p="stock">Stock y trazabilidad</button><button class="admin" data-p="out">Egresos y remisión</button><button data-p="zf">ZF5 y tránsitos</button><button class="admin" data-p="clients">Clientes y contratos</button><button class="admin" data-p="tariffs">Tarifas por cliente</button><button data-p="quote">Mi presupuesto</button></div></aside><main id="content"></main></div></section><script>const C=[['EGT','30-71234567-8','Por vencer','Pendiente','15/09/2026','USD 250.000','m³','USD',2.5],['Yamaha','30-50123456-7','Vigente','Vigente','31/12/2026','USD 1.500.000','m³','USD',3.1],['ZMG','30-70987654-1','Vigente','Vigente','30/06/2027','USD 800.000','Plano','USD',4000],['Pampa','30-71333444-5','Vencido','Pendiente','30/06/2026','USD 300.000','m²','USD',.9]],S=[['EGT','26033ZFI5001290M','TRM4-000184',1,1,'MOTOR ELÉCTRICO 5HP','WEG',24,18.4],['EGT','26033ZFI5001290M','TRM4-000184',2,1,'TABLERO INDUSTRIAL','ABB',12,9.8],['EGT','26033ZFI5001301K','TRM4-000199',1,1,'BOMBAS CENTRÍFUGAS','KSB',36,21.6],['Yamaha','26033ZFI5001200A','TRM4-000150',1,1,'REPUESTOS MOTOS','YAMAHA',540,42.3],['ZMG','26033ZFI5001188B','TRM4-000141',1,1,'ESTRUCTURAS METÁLICAS','ZMG',88,310],['Pampa','26033ZFI5001150C','TRM4-000130',1,1,'MAQUINARIA AGRÍCOLA','PAMPA',7,145]];let role='admin',cu='EGT',p='home';const $=s=>document.querySelector(s),ct=$('#content');function op(){return C.map(x=>`<option>${x[0]}</option>`).join('')}function badge(v){return `<span class="badge ${v==='Vigente'?'ok':v==='Vencido'?'bad':'warn'}">${v}</span>`}function rows(){return role==='client'?S.filter(x=>x[0]===cu):S}function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({home,ret,stock,out,zf,clients,tariffs,quote}[p]||home)()}function home(){let r=rows();ct.innerHTML=`<h1>Inicio</h1><p class="muted">Resumen operativo y alertas.</p><div class="grid"><div class="card kpi"><span>Unidades</span><b>${r.reduce((a,x)=>a+x[7],0)}</b></div><div class="card kpi"><span>Volumen</span><b>${r.reduce((a,x)=>a+x[8],0).toFixed(1)} m³</b></div><div class="card kpi"><span>Contratos por vencer</span><b>1</b></div><div class="card kpi"><span>Matrículas pendientes</span><b>2</b></div></div><div class="card"><h2>Alertas</h2><p>EGT tiene matrícula pendiente y contrato próximo a vencer. Pampa tiene contrato vencido.</p></div>`}function ret(){ct.innerHTML=`<h1>Ingreso de RET</h1><div class="card"><div class="form"><div><label>Cliente a cargar</label><select>${op()}</select></div><div><label>Número de tránsito</label><input></div><div><label>Archivo C.RET</label><input id="cr" type="file"></div><div><label>Archivo I.RET</label><input id="ir" type="file"></div><div class="wide"><label>Observaciones</label><textarea></textarea></div></div><button class="btn primary" onclick="document.querySelector('#rm').textContent=cr.files.length&&ir.files.length?'Documentación completa.':'Debe adjuntar C.RET e I.RET.'">Validar ingreso</button><p id="rm"></p></div>`}function stock(){ct.innerHTML=`<h1>Stock y trazabilidad</h1><p class="muted">Consulta por ZF5, tránsito, artículo o marca.</p><div class="card"><input id="q" placeholder="Buscar..." oninput="fs()"><div class="table"><table><thead><tr><th>Cliente</th><th>ZF5</th><th>Tránsito</th><th>Ítem</th><th>Subítem</th><th>Artículo</th><th>Marca</th><th>Unidades</th><th>m³</th></tr></thead><tbody id="tb">${rows().map(rr).join('')}</tbody></table></div><button class="btn" onclick="print()">Descargar PDF</button></div>`}function rr(x){return `<tr>${x.map(v=>`<td>${v}</td>`).join('')}</tr>`}window.fs=()=>{let q=$('#q').value.toLowerCase();$('#tb').innerHTML=rows().filter(x=>x.join(' ').toLowerCase().includes(q)).map(rr).join('')}function out(){ct.innerHTML=`<h1>Egresos y remisión</h1><div class="card"><div class="form"><div><label>Cliente</label><select>${op()}</select></div><div><label>ZF5 a cancelar</label><input></div><div><label>Ítem</label><input></div><div><label>Artículo</label><input></div><div><label>Cantidad cancelada</label><input type="number"></div><div><label>Número de remisión</label><input></div><div><label>Número de ZF</label><input></div><div class="wide"><label>Observación de facturación</label><textarea></textarea></div></div><button class="btn primary">Validar retiro</button></div>`}function zf(){ct.innerHTML=`<h1>ZF5 y tránsitos</h1><div class="card"><div class="table"><table><thead><tr><th>Cliente</th><th>ZF5</th><th>Tránsito</th><th>Unidades</th><th>m³</th></tr></thead><tbody>${rows().map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[7]}</td><td>${x[8]}</td></tr>`).join('')}</tbody></table></div></div>`}function clients(){ct.innerHTML=`<h1>Clientes y contratos</h1><button class="btn primary" onclick="edit(-1)">Agregar cliente</button><div class="card"><div class="table"><table><thead><tr><th>Cliente</th><th>CUIT</th><th>Contrato</th><th>Matrícula</th><th>Vencimiento</th><th>Exposición</th><th>Tarifa</th><th></th></tr></thead><tbody>${C.map((x,i)=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${badge(x[2])}</td><td>${badge(x[3])}</td><td>${x[4]}</td><td>${x[5]}</td><td>${x[6]} · ${x[7]}</td><td><button class="btn" onclick="edit(${i})">Ingresar</button></td></tr>`).join('')}</tbody></table></div></div>`}window.edit=i=>{let x=i<0?['','','Vigente','Pendiente','','','m³','USD',0]:C[i];ct.innerHTML=`<h1>${i<0?'Agregar cliente':x[0]}</h1><div class="card"><div class="form"><div><label>Razón social</label><input value="${x[0]}"></div><div><label>CUIT</label><input value="${x[1]}"></div><div><label>Contrato</label><select><option>${x[2]}</option><option>Vigente</option><option>Por vencer</option><option>Vencido</option></select></div><div><label>Matrícula</label><select><option>${x[3]}</option><option>Vigente</option><option>Pendiente</option></select></div><div><label>Vencimiento</label><input value="${x[4]}"></div><div><label>Exposición</label><input value="${x[5]}"></div><div><label>Unidad tarifaria</label><select><option>${x[6]}</option><option>m²</option><option>m³</option><option>Plano</option></select></div><div><label>Moneda</label><select><option>${x[7]}</option><option>USD</option><option>ARS</option></select></div><div><label>Tarifa</label><input value="${x[8]}"></div><div class="wide"><label>Observaciones</label><textarea></textarea></div></div><button class="btn primary">Guardar cliente</button> <button class="btn" onclick="p='clients';render()">Volver</button></div>`}function tariffs(){ct.innerHTML=`<h1>Tarifas por cliente</h1><div class="card"><div class="table"><table><thead><tr><th>Cliente</th><th>Unidad</th><th>Moneda</th><th>Tarifa</th><th></th></tr></thead><tbody>${C.map((x,i)=>`<tr><td>${x[0]}</td><td>${x[6]}</td><td>${x[7]}</td><td>${x[8]}</td><td><button class="btn" onclick="edit(${i})">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`}function quote(){ct.innerHTML=`<h1>Mi presupuesto</h1><div class="card"><div class="form"><div><label>Cliente</label><select id="qc" ${role==='client'?'disabled':''}>${op()}</select></div><div><label>Cantidad / volumen</label><input id="qt" type="number" value="10"></div><div><label>Días</label><input id="qd" type="number" value="15"></div></div><button class="btn primary" onclick="calc()">Calcular</button><h2 id="qr"></h2></div>`;$('#qc').value=role==='client'?cu:'EGT';calc()}window.calc=()=>{let x=C.find(y=>y[0]===$('#qc').value),v=x[6]==='Plano'?x[8]:+$('#qt').value*+$('#qd').value*x[8];$('#qr').textContent=`Total estimado: ${x[7]} ${v.toFixed(2)}`}document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{document.querySelectorAll('.role').forEach(x=>x.classList.remove('active'));b.classList.add('active');role=b.dataset.role;$('#client').disabled=role!=='client'});$('#enter').onclick=()=>{if($('#pass').value!=='demo123'){let e=$('#err');e.classList.remove('hidden');e.textContent='Contraseña incorrecta';return}cu=$('#client').value;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');document.querySelectorAll('.admin').forEach(x=>x.classList.toggle('hidden',role==='client'));$('#mode').textContent=role==='client'?'Portal de '+cu:'Gestión interna';render()};document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{p=b.dataset.p;render()});</script></body></html>
