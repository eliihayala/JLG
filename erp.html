<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#092738">
<title>JLG Control · Cargando</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f3f7f9;color:#173345}.loading{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(430px,100%);background:#fff;border:1px solid #dce7ec;border-radius:20px;padding:30px;text-align:center;box-shadow:0 16px 44px rgba(13,53,73,.12)}.logo{width:112px;max-height:82px;object-fit:contain;margin-bottom:16px}.spinner{width:42px;height:42px;margin:18px auto;border:4px solid #dff3fb;border-top-color:#1699d2;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px}p{color:#6e8290;margin:0;line-height:1.5}.error{color:#a83c3c;background:#fff0f0;border:1px solid #efcaca;border-radius:12px;padding:12px;margin-top:16px;text-align:left;display:none}
</style>
</head>
<body>
<div class="loading"><div class="box"><img class="logo" src="jlg-logo.png" alt="JLG"><h1>Cargando JLG Control</h1><div class="spinner"></div><p>Preparando la gestión operativa y el portal de clientes.</p><div id="error" class="error"></div></div></div>
<script>
(async function(){
  const errorBox=document.getElementById('error');
  try{
    if(!('DecompressionStream' in window)) throw new Error('Este navegador necesita actualizarse para abrir la aplicación.');
    const files=['payload/jlg-v9-1.txt','payload/jlg-v9-2.txt','payload/jlg-v9-3.txt','payload/jlg-v9-4.txt','payload/jlg-v9-5.txt'];
    const parts=await Promise.all(files.map(async function(path){
      const response=await fetch(path+'?v=9',{cache:'no-store'});
      if(!response.ok) throw new Error('No se pudo cargar '+path+' ('+response.status+').');
      return (await response.text()).trim();
    }));
    const binary=atob(parts.join(''));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const decompressed=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(decompressed).text();
    if(!html.startsWith('<!doctype html>')) throw new Error('El contenido de la aplicación no es válido.');
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.querySelector('.spinner').style.display='none';
    errorBox.style.display='block';
    errorBox.textContent='No se pudo abrir JLG Control: '+error.message+' Recargá la página e intentá nuevamente.';
  }
})();
</script>
</body>
</html>
